<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Singapore financial calculators that show their working: mortgage, CPF, tax, stamp duty, loans and investing.">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFFFF">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0B0F0D">

  <!-- iOS: add to home screen opens full screen, like an app -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Basis">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Basis</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #FFFFFF; }
    #loading {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px;
      font: 500 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #5B6B66;
      transition: opacity .25s ease;
    }
    #loading .mark {
      width: 64px; height: 64px; border-radius: 16px;
      background: #0F6E52; color: #FFFFFF;
      display: flex; align-items: center; justify-content: center;
      font: 700 34px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #loading .bar {
      width: 120px; height: 3px; border-radius: 3px; background: #E3EAE7; overflow: hidden;
    }
    #loading .bar::after {
      content: ""; display: block; width: 40%; height: 100%; background: #0F6E52;
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
    /* Match the app's dark theme so a dark-mode phone does not flash white. */
    @media (prefers-color-scheme: dark) {
      html, body { background: #0B0F0D; }
      #loading { color: #9AAAA4; }
      #loading .mark { background: #46B48F; color: #0B0F0D; }
      #loading .bar { background: #1F2925; }
      #loading .bar::after { background: #46B48F; }
    }
    @media (prefers-reduced-motion: reduce) { #loading .bar::after { animation: none; width: 100%; } }
  </style>
</head>
<body>
  <div id="loading" role="status" aria-live="polite">
    <div class="mark">B</div>
    <div class="bar"></div>
    <div>Loading Basis</div>
  </div>
  <noscript>Basis needs JavaScript turned on.</noscript>
  <script>
    // Remove the loading screen once Flutter has drawn its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (!el) return;
      el.style.opacity = '0';
      setTimeout(function () { el.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
